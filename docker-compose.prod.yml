services:
  db:
    image: mysql:8.0
    container_name: educationapi_db_prod
    restart: always
    environment:
      MYSQL_DATABASE: educationapi_db
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data_prod:/var/lib/mysql
    networks:
      - education_network_prod

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: educationapi_app_prod
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - uploads_data_prod:/app/uploads
    networks:
      - education_network_prod

volumes:
  mysql_data_prod:
  uploads_data_prod:

networks:
  education_network_prod:
    driver: bridge