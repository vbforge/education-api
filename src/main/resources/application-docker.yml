spring:
  datasource:
    url: jdbc:mysql://db:3306/educationapi_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  mail:
    host: ${MAIL_HOST:mailhog}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_USERNAME:false}
          starttls:
            enable: false

logging:
  level:
    com.vbforge.educationapi: INFO
    org.springframework.web: WARN

app:
  storage:
    upload-dir: /app/uploads
    allowed-extensions: pdf,doc,docx,txt,zip,png,jpg
    max-file-size-bytes: 10485760