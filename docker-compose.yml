services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: educationapi_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: educationapi_db
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-educationapi}
      MYSQL_PASSWORD: ${DB_PASSWORD:-educationapi}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - education_network

  # MailHog for email testing (captures emails without sending)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: educationapi_mailhog
    ports:
      - "1025:1025"  # SMTP port
      - "8025:8025"  # Web UI
    restart: unless-stopped
    networks:
      - education_network

  # Spring Boot Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: educationapi_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: ${DB_USERNAME:-educationapi}
      DB_PASSWORD: ${DB_PASSWORD:-educationapi}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
    volumes:
      - uploads_data:/app/uploads
    networks:
      - education_network

volumes:
  mysql_data:
  uploads_data:

networks:
  education_network:
    driver: bridge